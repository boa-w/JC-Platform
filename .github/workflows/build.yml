name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  NIGHTLY_TAG: nightly

jobs:
  prepare-nightly:
    name: Prepare nightly release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute nightly version
        id: version
        shell: bash
        run: |
          VERSION=$(node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const core = String(pkg.version).split('-')[0].split('.').map(Number);
          if (core.length !== 3 || core.some((n) => !Number.isInteger(n))) {
            throw new Error(`Invalid package version: ${pkg.version}`);
          }
          const build = Number(process.env.GITHUB_RUN_NUMBER) % 65535 || 65535;
          core[2] += 1;
          process.stdout.write(`${core.join('.')}-${build}`);
          NODE
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Nightly version: $VERSION"

      - name: Recreate nightly release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release delete "$NIGHTLY_TAG" --yes --cleanup-tag || true
          git tag -f "$NIGHTLY_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$NIGHTLY_TAG" --force

          SHORT_SHA="${GITHUB_SHA::7}"
          gh release create "$NIGHTLY_TAG" \
            --target "$GITHUB_SHA" \
            --title "Nightly $SHORT_SHA" \
            --notes "Automated nightly build from main commit $GITHUB_SHA. App version: $NIGHTLY_VERSION." \
            --prerelease

          RELEASE_ID=$(gh release view "$NIGHTLY_TAG" --json databaseId --jq '.databaseId')
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.label }})
    needs:
      - prepare-nightly
    if: always() && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-aarch64
          # - platform: ubuntu-22.04
          #   target: x86_64-unknown-linux-gnu
          #   label: linux-x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Apply nightly version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NIGHTLY_VERSION: ${{ needs.prepare-nightly.outputs.version }}
        shell: bash
        run: |
          npm version "$NIGHTLY_VERSION" --no-git-tag-version
          npm run version:sync
          npm run version:check

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.5.20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ github.event_name == 'push' && needs.prepare-nightly.outputs.release_id || '' }}
          tagName: ${{ github.event_name == 'push' && env.NIGHTLY_TAG || github.event.release.tag_name || '' }}
          releaseDraft: false
          prerelease: ${{ github.event_name == 'push' && 'true' || github.event.release.prerelease }}
          appName: JC-Platform
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }} ${{ github.event_name != 'pull_request' && '--config src-tauri/tauri.updater.conf.json' || '' }}

      - name: Upload Windows workflow artifacts
        if: startsWith(matrix.label, 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
          if-no-files-found: warn

      - name: Upload macOS workflow artifacts
        if: startsWith(matrix.label, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
          if-no-files-found: warn

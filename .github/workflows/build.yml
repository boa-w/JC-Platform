name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  NIGHTLY_TAG: nightly

jobs:
  frontend_quality:
    name: Frontend quality
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend
        run: npm run lint && npm run test:frontend && npm run build

  rust_quality:
    name: Rust quality
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

  ui_quality:
    name: UI quality
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install browser for UI tests
        run: npx playwright install chromium

      - name: Run UI tests
        run: npm run test:e2e

      - name: Upload UI test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  quality:
    name: Quality gate
    needs:
      - frontend_quality
      - rust_quality
      - ui_quality
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Require every quality check
        env:
          FRONTEND_RESULT: ${{ needs.frontend_quality.result }}
          RUST_RESULT: ${{ needs.rust_quality.result }}
          UI_RESULT: ${{ needs.ui_quality.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$FRONTEND_RESULT" = "success"
          test "$RUST_RESULT" = "success"
          test "$UI_RESULT" = "success"

  prepare-nightly:
    name: Prepare nightly release
    needs:
      - quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      has_previous_windows: ${{ steps.previous_windows.outputs.found }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute nightly version
        id: version
        shell: bash
        run: |
          VERSION=$(node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const core = String(pkg.version).split('-')[0].split('.').map(Number);
          if (core.length !== 3 || core.some((n) => !Number.isInteger(n))) {
            throw new Error(`Invalid package version: ${pkg.version}`);
          }
          const build = Number(process.env.GITHUB_RUN_NUMBER) % 65535 || 65535;
          core[2] += 1;
          process.stdout.write(`${core.join('.')}-${build}`);
          NODE
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Nightly version: $VERSION"

      - name: Preserve previous Windows nightly installer
        id: previous_windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          mkdir -p previous-installer
          if gh release download "$NIGHTLY_TAG" \
            --repo "$REPO" \
            --pattern '*_x64-setup.exe' \
            --dir previous-installer; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No previous Windows nightly installer is available."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload previous Windows nightly installer
        if: steps.previous_windows.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: previous-nightly-windows-installer
          path: previous-installer/*_x64-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Update nightly release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          git tag -f "$NIGHTLY_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$NIGHTLY_TAG" --force

          SHORT_SHA="${GITHUB_SHA::7}"
          if gh release view "$NIGHTLY_TAG" >/dev/null 2>&1; then
            gh release edit "$NIGHTLY_TAG" \
              --target "$GITHUB_SHA" \
              --title "Nightly $SHORT_SHA" \
              --notes "Automated nightly build from main commit $GITHUB_SHA. App version: $NIGHTLY_VERSION." \
              --prerelease
          else
            gh release create "$NIGHTLY_TAG" \
              --target "$GITHUB_SHA" \
              --title "Nightly $SHORT_SHA" \
              --notes "Automated nightly build from main commit $GITHUB_SHA. App version: $NIGHTLY_VERSION." \
              --prerelease
          fi

  build:
    name: Build (${{ matrix.label }})
    needs:
      - quality
      - prepare-nightly
    if: always() && needs.quality.result == 'success' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-aarch64
          # - platform: ubuntu-22.04
          #   target: x86_64-unknown-linux-gnu
          #   label: linux-x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Check stable release readiness
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: npm run release:check -- --channel stable --target ${{ matrix.target }}

      - name: Apply nightly version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NIGHTLY_VERSION: ${{ needs.prepare-nightly.outputs.version }}
        shell: bash
        run: |
          npm version "$NIGHTLY_VERSION" --no-git-tag-version
          npm run version:sync
          npm run version:check

      - name: Build Tauri app
        if: github.event_name != 'release'
        uses: tauri-apps/tauri-action@v0.5.20
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }} ${{ github.event_name == 'pull_request' && '--no-bundle' || '' }} ${{ github.event_name == 'push' && '--config src-tauri/tauri.nightly.conf.json' || '' }}

      - name: Build signed Tauri app
        if: github.event_name == 'release'
        uses: tauri-apps/tauri-action@v0.5.20
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        with:
          args: --target ${{ matrix.target }} --config src-tauri/tauri.updater.conf.json

      - name: Download previous Windows nightly installer
        if: startsWith(matrix.label, 'windows') && github.event_name == 'push' && needs.prepare-nightly.outputs.has_previous_windows == 'true'
        uses: actions/download-artifact@v4
        with:
          name: previous-nightly-windows-installer
          path: previous-installer

      - name: Smoke test Windows installer
        if: startsWith(matrix.label, 'windows') && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe" |
            Select-Object -First 1 -ExpandProperty FullName
          if ("${{ github.event_name }}" -eq "release") {
            $msi = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi" |
              Select-Object -First 1 -ExpandProperty FullName
            ./scripts/test-windows-installer.ps1 `
              -InstallerPath $installer `
              -RequireSignature `
              -AdditionalSignaturePath $msi
          } else {
            ./scripts/test-windows-installer.ps1 -InstallerPath $installer
          }

      - name: Smoke test Windows cross-version upgrade
        if: startsWith(matrix.label, 'windows') && github.event_name == 'push' && needs.prepare-nightly.outputs.has_previous_windows == 'true'
        shell: pwsh
        run: |
          $previous = Get-ChildItem "previous-installer/*-setup.exe" |
            Select-Object -First 1 -ExpandProperty FullName
          $current = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe" |
            Select-Object -First 1 -ExpandProperty FullName
          ./scripts/test-windows-upgrade.ps1 `
            -PreviousInstallerPath $previous `
            -CurrentInstallerPath $current

      - name: Smoke test macOS bundle
        if: startsWith(matrix.label, 'macos') && github.event_name != 'pull_request'
        shell: bash
        run: |
          dmg=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -type f -name '*.dmg' -print -quit)
          args=(--dmg "$dmg")
          if [ "${{ github.event_name }}" = "release" ]; then
            args+=(--require-signature)
          fi
          bash ./scripts/test-macos-bundle.sh "${args[@]}"

      - name: Verify macOS updater artifacts
        if: startsWith(matrix.label, 'macos') && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="src-tauri/target/${{ matrix.target }}/release/bundle"
          archive_list=$(find "$bundle_root" -type f -name '*.app.tar.gz' -print)
          archive_count=$(printf '%s\n' "$archive_list" | sed '/^$/d' | wc -l | tr -d ' ')
          if [ "$archive_count" -ne 1 ]; then
            echo "Expected exactly one macOS updater archive, found $archive_count." >&2
            find "$bundle_root" -maxdepth 3 -type f -print | sort >&2
            exit 1
          fi
          archive="$archive_list"
          signature="${archive}.sig"
          if [ ! -s "$signature" ]; then
            echo "Missing or empty macOS updater signature: $signature" >&2
            find "$bundle_root" -maxdepth 3 -type f -print | sort >&2
            exit 1
          fi
          echo "Verified macOS updater archive: $archive"

      - name: Upload Windows workflow artifacts
        if: startsWith(matrix.label, 'windows') && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
          if-no-files-found: error

      - name: Upload macOS workflow artifacts
        if: startsWith(matrix.label, 'macos') && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
          if-no-files-found: error

  publish-release-assets:
    name: Publish verified release assets
    needs:
      - prepare-nightly
      - build
    if: >-
      always() &&
      needs.build.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepare-nightly.result == 'success') ||
      github.event_name == 'release')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download verified installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true

      - name: Prepare and publish updater assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_VERSION: ${{ needs.prepare-nightly.outputs.version }}
          RELEASE_NOTES: ${{ github.event.release.body }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            version="$NIGHTLY_VERSION"
            tag="$NIGHTLY_TAG"
            notes="Automated nightly build from main commit ${GITHUB_SHA}."
          else
            version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
            tag="$RELEASE_TAG"
            notes="${RELEASE_NOTES:-Release ${version}.}"
          fi

          mkdir -p publish-assets
          node scripts/prepare-release-assets.mjs \
            --input release-assets \
            --output publish-assets \
            --version "$version" \
            --tag "$tag" \
            --repository "$REPO" \
            --notes "$notes"

          echo "Prepared release assets:"
          find publish-assets -maxdepth 1 -type f -printf '%f\n' | sort

          manifest="publish-assets/latest.json"
          mapfile -d '' assets < <(find publish-assets -maxdepth 1 -type f ! -name 'latest.json' -print0)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No verified release assets were prepared." >&2
            exit 1
          fi
          gh release upload "$tag" "${assets[@]}" --repo "$REPO" --clobber
          gh release upload "$tag" "$manifest" --repo "$REPO" --clobber

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            while IFS= read -r existing; do
              if [ ! -f "publish-assets/$existing" ]; then
                echo "Removing stale nightly asset: $existing"
                gh release delete-asset "$tag" "$existing" --repo "$REPO" --yes
              fi
            done < <(gh release view "$tag" --repo "$REPO" --json assets --jq '.assets[].name')
          fi

[package]
name = "jc_custom_platform_tauri"
version = "0.1.0"
description = "自定义开发平台"
authors = ["JC"]
homepage = "https://github.com/boa-w/JC-Platform"
repository = "https://github.com/boa-w/JC-Platform"
edition = "2021"
default-run = "jc_custom_platform_tauri"

[lib]
name = "jc_custom_platform_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
calamine = "0.26"
can-dbc = { version = "9", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
md5 = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
thiserror = "2"
